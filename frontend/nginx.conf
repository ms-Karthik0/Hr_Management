server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/employees {
        proxy_pass http://employee-service:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/departments {
        proxy_pass http://employee-service:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ai/ {
        proxy_pass http://employee-service:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/payroll {
        proxy_pass http://payroll-service:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/attendance {
        proxy_pass http://workforce-service:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/leaves {
        proxy_pass http://workforce-service:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/performance {
        proxy_pass http://workforce-service:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/notifications {
        proxy_pass http://workforce-service:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/dashboard {
        proxy_pass http://workforce-service:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ws/ {
        proxy_pass http://workforce-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        return 404;
    }
}

services:
  postgres:
    image: postgres:17
    container_name: nexushr-postgres
    environment:
      POSTGRES_DB: nexushr
      POSTGRES_USER: nexushr
      POSTGRES_PASSWORD: nexushr
    ports:
      - "5433:5432"
    volumes:
      - nexushr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U nexushr -d nexushr"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    container_name: nexushr-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/nexushr
      DB_USERNAME: nexushr
      DB_PASSWORD: nexushr
      JWT_SECRET: change-this-in-production-to-a-random-32-byte-secret
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  nexushr_pgdata:

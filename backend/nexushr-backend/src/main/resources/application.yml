spring:
  application:
    name: nexushr-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nexushr}
    username: ${DB_USERNAME:nexushr}
    password: ${DB_PASSWORD:nexushr}
    hikari:
      data-source-properties:
        TimeZone: UTC
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

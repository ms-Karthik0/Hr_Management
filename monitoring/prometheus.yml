global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nexushr-backend'
    metrics_path: '/api/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'nexushr-postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'nexushr-redis'
    static_configs:
      - targets: ['redis-exporter:9121']

services:
  postgres:
    image: postgres:17
    container_name: nexushr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexushr}
      POSTGRES_USER: ${POSTGRES_USER:-nexushr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexushr}
    ports:
      - "5432:5432"
    volumes:
      - nexushr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexushr} -d ${POSTGRES_DB:-nexushr}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend/nexushr-backend
    container_name: nexushr-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexushr}
      DB_USERNAME: ${POSTGRES_USER:-nexushr}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nexushr}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-a-long-random-value}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: nexushr-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  nexushr_pgdata:

name: NexusHR CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-build:
    name: Backend CI (Java 21 / Spring Boot 3.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          mvn clean test

      - name: Package Backend Jar
        run: |
          cd backend
          mvn package -DskipTests

  frontend-test-and-build:
    name: Frontend CI (React 19 / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile TypeScript & Build Static Assets
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Containerization & Registry Publish
    needs: [backend-test-and-build, frontend-test-and-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t nexushr/backend:latest ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t nexushr/frontend:latest ./frontend

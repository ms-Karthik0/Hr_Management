name: NexusHR CI/CD Pipeline

on:
  push:
    branches: [ main, develop, nexusHr_full ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-build:
    name: Legacy backend CI (Java 21 / Spring Boot 3.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          mvn clean test

      - name: Package Backend Jar
        run: |
          cd backend
          mvn package -DskipTests

  microservices-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, employee-service, workforce-service, payroll-service]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'services/${{ matrix.service }}/pom.xml'

      - name: Test and Package Microservice
        run: mvn -B -f services/${{ matrix.service }}/pom.xml clean verify

  frontend-test-and-build:
    name: Frontend CI (React 19 / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile TypeScript & Build Static Assets
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Containerization & Registry Publish
    needs: [backend-test-and-build, microservices-test, frontend-test-and-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Auth Service Docker Image
        run: docker build -t nexushr/auth-service:latest ./services/auth-service

      - name: Build Employee Service Docker Image
        run: docker build -t nexushr/employee-service:latest ./services/employee-service

      - name: Build Workforce Service Docker Image
        run: docker build -t nexushr/workforce-service:latest ./services/workforce-service

      - name: Build Payroll Service Docker Image
        run: docker build -t nexushr/payroll-service:latest ./services/payroll-service

      - name: Build Frontend Docker Image
        run: |
          docker build -t nexushr/frontend:latest ./frontend

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexushr-frontend
  labels:
    app: nexushr-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexushr-frontend
  template:
    metadata:
      labels:
        app: nexushr-frontend
    spec:
      containers:
        - name: frontend
          image: nexushr/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nexushr-frontend-service
spec:
  selector:
    app: nexushr-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
